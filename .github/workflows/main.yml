name: Validate and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LaunchApp/package-lock.json
      - run: dotnet workload install wasm-tools
      - run: dotnet restore handlerlaunch.sln -p:EnableWindowsTargeting=true
      - run: dotnet build handlerlaunch.sln -c Release -p:EnableWindowsTargeting=true --no-restore
      - run: dotnet test WebLaunch.Tests/WebLaunch.Tests.csproj -c Release --no-build
      - run: python3 scripts/audit-dependencies.py
      - run: npm ci --prefix LaunchApp && npm audit --prefix LaunchApp
      - run: bash scripts/publish-web.sh
      - name: Browser scenarios against production path and synthetic bridge
        run: |
          npx --prefix LaunchApp playwright install --with-deps chromium
          python3 scripts/serve-preview.py > /tmp/web.log 2>&1 &
          dotnet run --project WebLaunch.SmokeHost -c Release --no-build > /tmp/bridge.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5148/WebLaunch/ >/dev/null && curl -fsS -X OPTIONS -H 'Origin: http://localhost:5148' http://127.0.0.1:47832/v2/hello >/dev/null; then break; fi
            sleep 1
          done
          npm test --prefix LaunchApp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: LaunchApp/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: artifacts/web/wwwroot
          include-hidden-files: true
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet workload install wasm-tools
      - run: dotnet build handlerlaunch.sln -c Release
      - run: dotnet test WebLaunch.Tests/WebLaunch.Tests.csproj -c Release --no-build
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: artifacts/WebLaunch-win-x64.zip
