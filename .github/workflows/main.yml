name: Validate and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LaunchApp/package-lock.json
      - run: npm ci --prefix LaunchApp
      - run: dotnet workload install wasm-tools
      - run: dotnet restore handlerlaunch.sln -p:EnableWindowsTargeting=true
      - run: dotnet build handlerlaunch.sln -c Release -p:EnableWindowsTargeting=true --no-restore
      - run: dotnet test WebLaunch.Tests/WebLaunch.Tests.csproj -c Release --no-build
      - run: bash scripts/publish-web.sh
      - name: Browser scenarios against production path and synthetic bridge
        run: |
          npx --prefix LaunchApp playwright install --with-deps chromium
          python3 scripts/serve-preview.py > /tmp/web.log 2>&1 &
          dotnet run --project WebLaunch.SmokeHost -c Release --no-build > /tmp/bridge.log 2>&1 &
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5148/WebLaunch/ >/dev/null && curl -fsS -X OPTIONS -H 'Origin: http://localhost:5148' http://127.0.0.1:47832/v2/hello >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/web.log /tmp/bridge.log || true
            exit 1
          fi
          npm test --prefix LaunchApp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failures
          path: LaunchApp/test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website
          path: artifacts/web/wwwroot
          include-hidden-files: true
      - run: python3 scripts/audit-dependencies.py
        if: ${{ !cancelled() }}
      - run: npm audit --prefix LaunchApp
        if: ${{ !cancelled() }}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --prefix LaunchApp
      - run: dotnet workload install wasm-tools
      - run: dotnet build handlerlaunch.sln -c Release
      - run: dotnet test WebLaunch.Tests/WebLaunch.Tests.csproj -c Release --no-build
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-launcher
          path: artifacts/WebLaunch-win-x64.zip
